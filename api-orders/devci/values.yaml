# api-orders / devci overrides. All values feed the dotnet-api subchart.
dotnet-api:
  replicaCount: 1
  image:
    repository: registry.example.com/franky/api-orders
    tag: "devci"
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api-orders.devci.example.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
