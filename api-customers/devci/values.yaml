# api-customers / devci overrides. All values feed the dotnet-api subchart.
dotnet-api:
  replicaCount: 1
  image:
    repository: registry-1.docker.io/fchanteau95/sample-api
    tag: "v1.0.1"
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api-customers.devci.example.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
