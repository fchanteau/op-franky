# api-customers / prod overrides. All values feed the dotnet-api subchart.
dotnet-api:
  replicaCount: 3
  image:
    repository: registry-1.docker.io/fchanteau95/starter-app
    tag: "latest"
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api-customers.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-customers-tls
        hosts:
          - api-customers.example.com
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
