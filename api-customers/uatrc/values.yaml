# api-customers / uatrc overrides. All values feed the dotnet-api subchart.
dotnet-api:
  replicaCount: 2
  image:
    repository: registry-1.docker.io/fchanteau95/starter-app
    tag: "latest"
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api-customers.uatrc.example.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
